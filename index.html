<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LULÚ AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor Principal de la Cara -->
    <div class="face-container" id="face">
        <div class="eye-socket">
            <div class="eye left-eye">
                <div class="iris">
                    <div class="pupil"></div>
                    <div class="glare"></div>
                </div>
                <div class="ring"></div>
            </div>
        </div>

        <div class="eye-socket">
            <div class="eye right-eye">
                <div class="iris">
                    <div class="pupil"></div>
                    <div class="glare"></div>
                </div>
                <div class="ring"></div>
            </div>
        </div>
    </div>

    <!-- Subtítulos e Indicador de Estado -->
    <div class="hud-container">
        <div class="status-indicator" id="statusIndicator"></div>
        <p class="subtitle-text" id="subtitleText">TOCA LA PANTALLA PARA ACTIVAR A LULÚ</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
